# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtest-dev

    # GitHub-hosted runners don't all support AVX-512, so fetch Intel SDE to
    # emulate it.  test/CMakeLists.txt runs the AVX-512 tests natively when the
    # CPU supports it and under SDE (found via SDE_PATH) otherwise.
    - name: Install Intel SDE
      run: |
        curl -sSfL -o sde.tar.xz https://downloadmirror.intel.com/843185/sde-external-9.48.0-2024-11-25-lin.tar.xz
        # Pin the exact archive: fail if Intel's file ever changes.
        echo "3173d2a5369e3385226b488d8b75403951bc14af601435fe707d9f83e0b533e6  sde.tar.xz" | sha256sum -c -
        mkdir -p ${{runner.temp}}/sde
        tar xf sde.tar.xz -C ${{runner.temp}}/sde --strip-components=1
        echo "SDE_PATH=${{runner.temp}}/sde" >> "$GITHUB_ENV"

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: cmake --preset gcc_release_deb

    - name: Build
      working-directory: ${{github.workspace}}
      run: |
        cmake --build build
        cd build && make package

    #-name: Package
    #  working-directory: ${{github.workspace}}/build
    #  run: make package

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      #run: ctest -C ${{env.BUILD_TYPE}}
      run: ctest --verbose

